# ~/.config/omarchy-voice/config.toml
# Every key here is optional — these are the defaults.

[openai]
# Used by `omarchy-voice say` (typed, no microphone). The daemon thinks with
# Claude; this is the Chat Completions model for one-shot plans.
planner_model = "gpt-4.1"
api_key_env = "OPENAI_API_KEY"
# How many tool rounds one spoken instruction may take before the assistant
# stops and waits to be asked again. Multi-step goals need the room; every
# round is also a turn against the API's per-minute token budget.
max_turns = 12

# Where `omarchy-voice say` sends its completions. Anything that speaks
# OpenAI's /v1/chat/completions works — Ollama, LM Studio, vLLM, OpenRouter —
# because the planner needs tool calls back in that shape, not OpenAI itself.
# A localhost endpoint needs no API key and none is sent.
#
# This moves the typed path only — `say` and `--dry-run` — which is also the
# one you want working when the API is down or out of credit. The daemon
# (`run`) thinks with Claude whatever this is set to.
#
# Pick the model for tool calling, not for size. On a local endpoint the
# planner asks for function calls, and a model that is not good at them
# answers with the JSON as prose instead of calling anything:
# qwen2.5-coder:14b did exactly that here, while qwen3:14b worked. Expect
# tens of seconds against ~10k tokens of manifest, rather than ~2.
# base_url = "http://localhost:11434/v1"
# planner_model = "qwen3:14b"
#
# Claude works too, through Anthropic's OpenAI-compatible endpoint. Tested:
# it returns tool calls in the same shape, so nothing else has to change.
# Note it bills the Anthropic API — a Claude subscription does not reach this
# endpoint — and that it formats for a screen unless told not to, which is
# wrong for something being read aloud.
# base_url = "https://api.anthropic.com/v1"
# planner_model = "claude-sonnet-4-5"
# api_key_env = "ANTHROPIC_API_KEY"

# A second way to reach Claude for `say`/`ask`, with no API key at all: the
# Claude Agent SDK drives the Claude Code CLI you are already logged into,
# so calls draw on your Claude Pro/Max subscription rather than metered API
# credit. "auto" uses it when `claude` is on PATH and logged in, falling
# back to the HTTP planner above otherwise.
#
# The package does NOT install `claude` — it has to already be on PATH.
# That is deliberate: Claude Code updates itself and talks to a fast-moving
# API, so pinning a copy through Nix would leave it stale until the flake
# was bumped by hand. This is the one dependency here that stays imperative
# rather than declarative. Run `omarchy-voice doctor` to see the path,
# version and login state it finds. If `claude` lives somewhere PATH does
# not reach, set claude_cli below or the OMARCHY_VOICE_CLAUDE_CLI env var
# rather than relying on PATH.
#
# This gives the model Claude Code's full toolset, Bash included. Those
# calls go through the same deny/confirm policy as everything else, via the
# SDK's can_use_tool callback — but that policy is regexes over a tool
# description, not a sandbox, so this is a wider surface than the HTTP
# planner above ever had. It also draws down your plan's usage, so a heavy
# session can hit a plan rate limit same as it would in the Claude Code CLI
# itself.
# claude_backend = "auto"          # "auto" | "claude-code" | "chat"
#
# Always the full model id, never an alias — an alias can silently resolve
# to an older model when it comes back through the CLI rather than the API.
# claude_model = "claude-sonnet-5"
#
# Path to the `claude` binary, if it is not on PATH. Checked before PATH is
# searched; OMARCHY_VOICE_CLAUDE_CLI takes priority over this if both are set.
# claude_cli = "/home/you/.local/bin/claude"
#
# What Claude Code's own Bash and Read see. Empty means $HOME.
# claude_cwd = ""

[ears]
# Listening always starts off. SUPER + SHIFT + V, or the bar widget, turns it
# on and off again — there is no always-on mode and no hold-to-talk. Muting
# stops the recorder rather than capturing and discarding, so nothing is
# picked up while it is off.
# device = "alsa_input.pci-0000_00_1f.3.analog-stereo"   # pin a specific mic

# The microphone is held shut while Oma speaks. On speakers her voice would
# otherwise leave the room and come back into an open mic, and be
# transcribed as you.
# Turn this on for headphones, or after setting up PipeWire echo cancellation
# (see share/echo-cancel.conf) — then you can interrupt her mid-sentence.
barge_in = false

# The end of a sentence: this much quiet and it is transcribed. Set it to 0.8
# if you get cut off mid-sentence.
# end_of_speech_seconds = 0.6
# Loudness counted as room tone, on the same 0..1 curve the orb uses. Raise it
# if a noisy room keeps a sentence from ending; lower it if quiet speech gets
# clipped.
silence_level = 0.02

# Switch listening off after this long with nothing said, as if the toggle had
# been pressed. The daemon stays up, so coming back is immediate. 0 disables
# it.
idle_stop_seconds = 600

# The word that starts a session hands-free. Empty means off, and off is the
# default: this keeps a microphone open locally whenever listening is *not* on,
# which is a thing to choose rather than inherit.
#
# Nothing leaves the machine until it fires. Audio goes to whisper.cpp on this
# CPU, and only once somebody actually speaks — silence never reaches the
# transcriber, let alone the API. That is the point: an assistant that is
# always available and costs nothing while nobody is talking.
#
# Pick something not said in normal conversation, then check `omarchy-voice
# log` for what whisper actually returns and add that spelling as a second
# word rather than arguing with the transcriber.
# wake_word = "oma ohma"
# wake_max_seconds = 8.0
# Names whisper keeps mishearing, comma-separated. The wake word, Claude,
# Hyprland, Omarchy and the coding agents are always included.
# whisper_vocabulary = "Vesktop, herdr"

# The whisper.cpp model `ask` and the wake word share. The package sets this
# via OMARCHY_VOICE_WHISPER_MODEL; override to point at another ggml model.
# whisper_model = "/path/to/ggml-tiny.en.bin"

[realtime]
# The OpenAI realtime engine was removed in 2.0.0 (#121); "local" is the only
# engine, and "openai" is refused.
engine = "local"

[hands]
# Notifications are recorded so "what was that?" can be answered. Worth turning
# on: the alternative is worse for the same privacy -- without it that question
# is answered by read_screen, which sends a picture of your whole desktop to
# OpenAI to recover four words. This sends the four words.
#
# Off by default all the same, because it writes notification bodies -- message
# previews included -- to ~/.local/state/omarchy-voice/notifications.jsonl, and
# that is a decision for whoever owns the desktop. Off records nothing and does
# not offer the tool.
allow_notifications = false

# Let the brain drive the desktop through ai-mirror: the real mouse, the real
# keyboard, the real screen. Off, because ai-mirror being installed is not a
# decision to hand any of that over. With it on, ai-mirror still asks you to
# confirm before control is granted, and SUPER + SHIFT + ESCAPE takes it back.
desktop_control = false

# Record where each task's time went, to ~/.local/state/omarchy-voice/session.log.
# One TIMING line per finished task: the total, how many model round trips a
# tool result cost, and seconds per phase. Useful when a turn felt slow and you
# want to know whether it was the thinking, the screen, or the waiting.
#
# It records phase names and durations and nothing else — not what was on
# screen, not which window, not the tool's arguments. That is by construction
# rather than by filtering: the recorder has no parameter those could arrive
# through. Off all the same, because it is still a record of when you were
# using the machine.
trace_timings = false

# Four fixed commands are run without asking Claude: workspace N, open a
# terminal, what windows are open, and focus/move/close one named window. Only
# when the sentence is exactly one of them; anything else goes to Claude.
router = true

# The shell tool is off by default. On, the model can run arbitrary commands —
# which is exactly as large a hole as it sounds, on an open microphone.
allow_shell = false
confirm_words = ["confirm", "yes do it", "go ahead"]
cancel_words = ["cancel", "never mind", "nevermind"]

# Extra patterns are *added* to the built-in list. To drop one built-in rule
# and keep the rest, name it in `*_remove` (names: README "Rule names").
# Set the matching `*_replace = true` only to throw every default away.
# confirm_patterns = ["\\bshutdown\\b"]
# confirm_patterns_remove = []
# confirm_patterns_replace = false
# deny_patterns = ["\\bterraform\\s+destroy\\b"]
# deny_patterns_remove = ["ssh"]
# deny_patterns_replace = false
# sensitive_patterns_remove = []

[mouth]
notify = true
speak  = false            # needs piper or espeak-ng
# tts_command = "piper-say"

[elevenlabs]
# A cloud voice for replies, used by `[realtime] engine = "local"` and by
# `speak`. Piper stays wired underneath: any failure here -- no key, no
# network, quota gone -- falls back to it and logs why. Degrade, never mute.
enabled = false

# An opaque id from YOUR account, not a name -- `omarchy-voice voices` lists
# them. There is no sensible default; a guessed one is somebody else's voice.
# voice_id = ""

# Never put the key itself here or in any file in this repo -- a key in
# config.toml is a key in whatever backup or git remote the config reaches.
#   secret-tool store --label omarchy-voice service omarchy-voice-elevenlabs
# ELEVENLABS_API_KEY works as a last resort but is a plaintext key on disk.
# key_slot = "omarchy-voice-elevenlabs"

# Turbo for English. Not the multilingual model, and style is deliberately
# left at 0 elsewhere in code -- both make delivery slower and duller, which
# is the wrong trade for an assistant answering in one sentence.
model = "eleven_turbo_v2_5"
stability = 0.5
similarity = 0.75

# Mastering applied locally with ffmpeg. The voice you audition on
# elevenlabs.io is a mastered demo clip; raw API output is quieter and
# flatter without this. A fixed gain to -16 LUFS, then a limiter at
# -1.5 dBFS, so she starts speaking while the clip is still downloading.
# G pending: owner calibration on #135
master = "volume=0dB,alimiter=limit=0.84:level=0"
# The old sound, and the old wait (loudnorm holds the whole clip):
# master = "loudnorm=I=-16:TP=-1.5:LRA=11"
