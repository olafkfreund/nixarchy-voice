# ~/.config/omarchy-voice/config.toml
# Every key here is optional — these are the defaults.

[openai]
# Used by `omarchy-voice say` (typed, no microphone). The daemon itself talks
# to the Realtime API; this is the Chat Completions model for one-shot plans.
planner_model = "gpt-4.1"
api_key_env = "OPENAI_API_KEY"
# How many tool rounds one spoken instruction may take before the assistant
# stops and waits to be asked again. Multi-step goals need the room; every
# round is also a turn against the API's per-minute token budget.
max_turns = 12

# Where `omarchy-voice say` sends its completions. Anything that speaks
# OpenAI's /v1/chat/completions works — Ollama, LM Studio, vLLM, OpenRouter —
# because the planner needs tool calls back in that shape, not OpenAI itself.
# A localhost endpoint needs no API key and none is sent.
#
# This does NOT move the realtime session. `run` speaks OpenAI's websocket
# protocol, which nothing else implements, and stays on the API whatever this
# is set to. What moves is the typed path — `say` and `--dry-run` — which is
# also the one you want working when the API is down or out of credit.
#
# Pick the model for tool calling, not for size. On a local endpoint the
# planner asks for function calls, and a model that is not good at them
# answers with the JSON as prose instead of calling anything:
# qwen2.5-coder:14b did exactly that here, while qwen3:14b worked. Expect
# tens of seconds against ~10k tokens of manifest, rather than ~2.
# base_url = "http://localhost:11434/v1"
# planner_model = "qwen3:14b"
#
# Claude works too, through Anthropic's OpenAI-compatible endpoint. Tested:
# it returns tool calls in the same shape, so nothing else has to change.
# Note it bills the Anthropic API — a Claude subscription does not reach this
# endpoint — and that it formats for a screen unless told not to, which is
# wrong for something being read aloud.
# base_url = "https://api.anthropic.com/v1"
# planner_model = "claude-sonnet-4-5"
# api_key_env = "ANTHROPIC_API_KEY"

[ears]
# Listening always starts off. SUPER + SHIFT + V, or the bar widget, turns it
# on and off again — there is no always-on mode and no hold-to-talk. Muting
# stops the recorder rather than capturing and discarding, so nothing is
# picked up while it is off.
# device = "alsa_input.pci-0000_00_1f.3.analog-stereo"   # pin a specific mic

# The microphone is held shut while Oma speaks. On speakers her voice would
# otherwise leave the room and come back into an open mic: the server's turn
# detection hears it, cancels her reply mid-word, and transcribes it as you.
# Turn this on for headphones, or after setting up PipeWire echo cancellation
# (see share/echo-cancel.conf) — then you can interrupt her mid-sentence.
barge_in = false

# Silence is billed at the same rate as speech, and a room is mostly silent.
# With the gate on, frames of room tone stop being uploaded once nothing has
# been said for `silence_hold_seconds`; when talking resumes, a short pre-roll
# is flushed first so the opening syllable is not clipped.
#
# The hold is not padding. Server-side turn detection ends a turn by hearing
# the pause after it, so cutting audio the moment you stop talking means the
# turn never ends and no reply ever comes. Do not set it near zero.
silence_gate = true
silence_hold_seconds = 1.5
# Loudness counted as room tone, on the same 0..1 curve the orb uses. Raise it
# if a noisy room keeps the gate open; lower it if quiet speech gets clipped.
silence_level = 0.02

# Switch listening off after this long with nothing said, as if the toggle had
# been pressed. The websocket stays up, so coming back is immediate. An open
# microphone you forgot about is the expensive kind. 0 disables it.
idle_stop_seconds = 600

# Conversation items kept before the oldest turns are deleted. Everything still
# in the conversation is re-sent as input on every turn, so this is the ceiling
# on what a long session costs per turn. 0 keeps everything, and pays for it.
history_items = 40

# The word that starts a session hands-free. Empty means off, and off is the
# default: this keeps a microphone open locally whenever listening is *not* on,
# which is a thing to choose rather than inherit.
#
# Nothing leaves the machine until it fires. Audio goes to whisper.cpp on this
# CPU, and only once somebody actually speaks — silence never reaches the
# transcriber, let alone the API. That is the point: an assistant that is
# always available and costs nothing while nobody is talking.
#
# Pick something not said in normal conversation, then check `omarchy-voice
# log` for what whisper actually returns and add that spelling as a second
# word rather than arguing with the transcriber.
# wake_word = "oma ohma"
# wake_max_seconds = 4.0

# The whisper.cpp model `ask` and the wake word share. The package sets this
# via OMARCHY_VOICE_WHISPER_MODEL; override to point at another ggml model.
# whisper_model = "/path/to/ggml-tiny.en.bin"

[realtime]
model = "gpt-realtime-2.1"
voice = "marin"           # cannot be changed once a session has spoken
turn_detection = "semantic_vad"   # semantic_vad | server_vad | none
sample_rate = 24000
# `none` commits the audio buffer when you toggle listening off, then asks
# for a response. Toggling off stops the recorder, so nothing is captured.

# Transcribes your own audio back into the log, so a misheard command can be
# told from a bad decision. Off by default because it is a second model run
# over every second of input audio, in addition to the realtime model already
# listening to it, and nothing but the log consumes it. Turn it on to debug.
# transcribe_model = "gpt-4o-mini-transcribe"

[hands]
# Notifications are recorded so "what was that?" can be answered. On, because
# the alternative is worse for the same privacy: without it that question is
# answered by read_screen, which sends a picture of your whole desktop to
# OpenAI to recover four words. This sends the four words.
#
# It does write notification bodies -- message previews included -- to
# ~/.local/state/omarchy-voice/notifications.jsonl, and what the model is asked
# about goes to the API. Off records nothing and does not offer the tool.
allow_notifications = true

# The shell tool is off by default. On, the model can run arbitrary commands —
# which is exactly as large a hole as it sounds, on an open microphone.
allow_shell = false
confirm_words = ["confirm", "yes do it", "go ahead"]
cancel_words = ["cancel", "never mind", "nevermind"]

# Extra patterns are *added* to the built-in list. Set the matching
# `*_replace = true` if you want to throw the defaults away.
# confirm_patterns = ["\\bshutdown\\b"]
# confirm_patterns_replace = false
# deny_patterns = ["\\bssh\\b"]
# deny_patterns_replace = false

[mouth]
notify = true
speak  = false            # needs piper or espeak-ng
# tts_command = "piper-say"
