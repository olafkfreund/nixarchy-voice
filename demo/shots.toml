# The demo's shot list, as data (#163). One file drives three things, so they
# cannot drift apart (nixarchy's #930 rule):
#   * `demo.py record` runs each `run` on razer and holds for `hold` seconds;
#   * `demo.py verify` OCRs the raw master at each beat's OBSERVED time and
#     requires `expect` there -- or, for a beat that is only heard, sound;
#   * `demo.py edit` burns `caption` over the same beat.
# A caption claiming what its beat does not show is a failed gate, not a
# subtitle nobody checked. Everything here runs for real on razer; the only
# stand-in is that the requests are typed (`listen say`), not spoken.
#
# `pick = [menu, row]` opens the menu and presses Return on that row, found by
# reading the menu (demo.py menu_pick): the menu reorders rows by use, and
# typing does not filter a submenu (takes 3-5).
#
# {when}  is replaced with the next whole minute at the moment beat 7 runs.

# No "turn her on" beat: listening opens razer's microphone, which heard
# people in the room in take 1. Typed turns need no listening.

[[beat]]
name = "ask"
run = "omarchy-voice listen say 'Make an action called demo-focus: switch to workspace 8, open https://github.com/olafkfreund/nixarchy-voice in its own window, and run git status in /tmp/oma-demo.'"
hold = 28
caption = "“Make an action called demo-focus: workspace 8, the project page, and git status in my demo repo.”"
expect_audio = true
expect = ""   # her readback is spoken, not shown: this beat is checked by ear

[[beat]]
name = "confirm"
run = "omarchy-voice listen confirm; sleep 4; omarchy-shell shell toggle omarchy.menu '{\"menu\":\"voice.actions\"}'"
hold = 6
caption = "Saved only after you confirm — and it is in the menu at once."
expect = "demo-focus"

[[beat]]
name = "run-from-menu"
run = ""
pick = ["voice.actions.demo-focus", "Run"]
hold = 16
caption = "Voice ▸ Actions ▸ demo-focus ▸ Run"
expect = "No commits yet"

[[beat]]
name = "failing-tests"
run = "omarchy-voice listen say 'Run make test in /tmp/oma-demo.'; sleep 16; omarchy-voice listen confirm"
hold = 20
caption = "“Run make test in my demo repo.” Shell commands wait for a yes — then a failure is reported as one."
expect = "Error 1"

[[beat]]
name = "uptime"
run = "omarchy-voice listen say 'How long has this machine been up?'"
hold = 14
caption = "“How long has this machine been up?”"
expect_audio = true
expect = ""   # answered aloud only; verify requires her voice in this beat

[[beat]]
name = "routine"
run = "sed -i 's/^when = .*/when = \"{when}\"/' ~/.config/omarchy-voice/actions/demo-hello.toml; omarchy-voice action list >/dev/null"
pick = ["voice.actions.demo-hello", "Routine"]
hold = 70
caption = "A routine: the same recipe on a timer. Its result arrives as a notification."
expect = "Oma: demo-hello"
