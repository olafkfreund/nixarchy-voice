# Open my development workspace: herdr (focused, or opened), a new herdr
# workspace in your repository with Claude carrying on where the last session
# stopped, and GitHub.
#
# Make it yours: set repo= below to your repository, and in the prompt name
# the desktop the ai-mirror MCP should drive.
#
# The first time in a repository there is nothing to continue, so Claude
# starts fresh there and is told so. A folder Claude has never been told to
# trust stops with a message: answer the dialog in the herdr pane and run it
# again. Oma never answers it for you.
#
# The herdr step runs a command, so it asks for confirmation the first time
# (the shell is off by default). Approve it once and it runs hands-free after:
#   omarchy-voice action approve dev-setup
description = "Open my development workspace"
phrases = ["dev setup", "development workspace", "start work"]

[[step]]
tool = "omarchy_cli"
args = { command = "launch terminal-herdr" }

# One line to the shell (the lines below are joined), in a subshell so a stop
# never closes the terminal it runs in. herdr's error code tells the cases
# apart: "timeout" means Claude found nothing to continue and exited, so start
# it fresh; "agent_not_ready" means it is waiting on the folder-trust dialog.
# ponytail: a resume slower than 15 s (3.9 s measured) stops with herdr's
# error; raise --timeout if yours is.
[[step]]
tool = "run_in_terminal"
args = { command = """\
( repo=~/src/my-project; \
p=$(herdr workspace create --cwd "$repo" --label dev --focus | jq -r .result.root_pane.pane_id) || exit 1; \
out=$(herdr agent start dev --kind claude --pane "$p" --timeout 15000 -- --continue); \
case $(printf %s "$out" | jq -r '.error.code // "ok"') in \
ok) hello="Continue where we left off." ;; \
timeout) herdr agent start dev --kind claude --pane "$p" >/dev/null || exit 1; \
hello="This is a new session in this repository: there was nothing to continue." ;; \
agent_not_ready) echo "Claude is asking whether to trust $repo. Answer it in the herdr pane, then run dev setup again."; exit 1 ;; \
*) printf '%s\\n' "$out"; exit 1 ;; \
esac; \
herdr agent prompt "$p" "$hello When something needs a UI test, drive the other desktop through the ai-mirror MCP, or the browser through the Chrome MCP, and tell me what you saw." )""" }

[[step]]
tool = "open_page"
args = { url = "https://github.com/notifications", read = false }
